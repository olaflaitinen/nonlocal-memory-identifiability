# Purpose: Settings of the two-dimensional pilot, which selects the twelve conditions of Section 5.4 and fixes the sampler settings.
# Manuscript: Section 5.4, Experiment 3.1.
# Inputs: the base design configuration. Outputs: the settings of this experiment.

# The base configuration whose entries this file overrides.
base: design_1d.yaml
# Identifier of this experiment, recorded in the output metadata.
experiment: exp_3_1_pilot_2d
# Settings of the two-dimensional pilot.
pilot_2d:
  # Grid size of the two-dimensional forward solves.
  n_points: 64
  # Time step of the two-dimensional forward solves.
  time_step: 0.005
  # Grid size of the two-dimensional reference solution.
  reference_points: 128
  # Time step of the two-dimensional reference solution.
  reference_time_step: 0.001
  # Perceptual ranges of the two-dimensional subset.
  radii: [0.15, 0.30]
  # Relative noise levels of the two-dimensional subset.
  noise_levels: [0.01, 0.05, 0.10]
  # Number of spatial sample points along each axis.
  n_space: 16
  # Number of observation times of the two-dimensional subset.
  n_time: 11
  # Number of walkers of the ensemble sampler.
  n_walkers: 32
  # Number of ensemble steps of the pilot.
  n_steps: 2000
