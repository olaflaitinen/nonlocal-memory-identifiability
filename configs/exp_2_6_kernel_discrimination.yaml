# Purpose: Settings of the kernel discrimination study, which fits both kernel families to data generated by each and compares them by leave one out cross-validation.
# Manuscript: Section 5.3, Experiment 2.6.
# Inputs: the base design configuration. Outputs: the settings of this experiment.

# The base configuration whose entries this file overrides.
base: design_1d.yaml
# Identifier of this experiment, recorded in the output metadata.
experiment: exp_2_6_kernel_discrimination
# Settings of the kernel discrimination study.
discrimination:
  # Perceptual ranges of the generating conditions.
  radii: [0.075, 0.15, 0.30]
  # Relative noise levels of the generating conditions.
  noise_levels: [0.01, 0.05, 0.10, 0.20]
  # Sampling design of the generating conditions.
  sampling: dense
  # Number of posterior draws used for the cross-validation.
  n_draws: 500
  # Number of iterations of each fitted chain.
  n_iterations: 8000
  # Fraction of each chain that is discarded as burn-in.
  burn_in_fraction: 0.5
  # Seed of the kernel discrimination study.
  seed: 2606
